<script>
(function(){
  var P = JSON.parse(document.getElementById("p").textContent), SK = "rsv.k";
  function b64(s){ return Uint8Array.from(atob(s), function(c){ return c.charCodeAt(0); }); }
  async function open(pw){
    var km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
    var key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(P.s), iterations:P.i, hash:"SHA-256"}, km, {name:"AES-GCM", length:256}, false, ["decrypt"]);
    var pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(P.v)}, key, b64(P.c));
    return new TextDecoder().decode(pt);
  }
  async function enter(pw, remember){
    var html = await open(pw.trim());
    if(remember){ try{ localStorage.setItem(SK, pw.trim()); }catch(e){} }
    document.open(); document.write(html); document.close();
  }
  document.getElementById("f").addEventListener("submit", async function(e){
    e.preventDefault();
    var go = document.getElementById("go"), err = document.getElementById("err");
    go.disabled = true; err.textContent = "";
    try{ await enter(document.getElementById("pw").value, document.getElementById("keep").checked); }
    catch(x){ err.textContent = "That is not the house phrase."; go.disabled = false; }
  });
  try{ var k = localStorage.getItem(SK); if(k){ enter(k, false).catch(function(){ localStorage.removeItem(SK); }); } }catch(e){}
})();
</script>
