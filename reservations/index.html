<title>Reservations</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:#12080C radial-gradient(700px 380px at 50% -80px,rgba(179,23,63,.25),transparent 70%) no-repeat; color:#F4EADD; font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{width:100%; max-width:380px; text-align:center; display:grid; gap:14px}
h1{margin:0; font:italic 700 44px/1.05 Georgia,"Times New Roman",serif}
p{margin:0; color:#C3ACA8}
.orn{height:1px; background:linear-gradient(90deg,transparent,#D4AF5F,transparent)}

button{min-height:50px; border-radius:12px; border:0; background:#B3173F; color:#fff; font-size:16px; font-weight:600; cursor:pointer}
button[disabled]{opacity:.6}
label{font-size:14px; color:#C3ACA8; display:flex; gap:8px; justify-content:center; align-items:center}
#err{min-height:1.5em; color:#E5484D}
</style>
</head>
<body>
<main>
  <h1>Reservations</h1>
  <div class="orn"></div>
  <p>Members only. Enter the house phrase to be seated.</p>

      <div id="err" role="status"></div>
    </div>
  </form>
</main>

<script>
(function(){
  var P = JSON.parse(document.getElementById("p").textContent), SK = "rsv.k";
  function b64(s){ return Uint8Array.from(atob(s), function(c){ return c.charCodeAt(0); }); }
  async function open(pw){
    var km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
    var key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(P.s), iterations:P.i, hash:"SHA-256"}, km, {name:"AES-GCM", length:256}, false, ["decrypt"]);
    var pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(P.v)}, key, b64(P.c));
    return new TextDecoder().decode(pt);
  }
  async function enter(pw, remember){
    var html = await open(pw.trim());
    if(remember){ try{ localStorage.setItem(SK, pw.trim()); }catch(e){} }
    document.open(); document.write(html); document.close();
  }
  document.getElementById("f").addEventListener("submit", async function(e){
    e.preventDefault();
    var go = document.getElementById("go"), err = document.getElementById("err");
    go.disabled = true; err.textContent = "";
    try{ await enter(document.getElementById("pw").value, document.getElementById("keep").checked); }
    catch(x){ err.textContent = "That is not the house phrase."; go.disabled = false; }
  });
  try{ var k = localStorage.getItem(SK); if(k){ enter(k, false).catch(function(){ localStorage.removeItem(SK); }); } }catch(e){}
})();
</script>
